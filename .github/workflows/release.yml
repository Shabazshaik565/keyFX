name: KeyFX Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri Application & Installer
        run: npm run tauri build

      - name: Optional Windows Code Signing
        shell: pwsh
        env:
          SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_CERTIFICATE }}
          SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:SIGNING_CERT_BASE64) -and -not [string]::IsNullOrWhiteSpace($env:SIGNING_CERT_PASSWORD)) {
            Write-Host "Code signing certificate found. Signing executables..."
            $certPath = "$env:RUNNER_TEMP\code_sign.pfx"
            [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:SIGNING_CERT_BASE64))
            
            $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1).FullName
            if ($signtool) {
              $exePath = "src-tauri\target\release\keyfx.exe"
              $installerPath = (Get-ChildItem "src-tauri\target\release\bundle\nsis\*.exe" | Select-Object -First 1).FullName
              
              & $signtool sign /f $certPath /p $env:SIGNING_CERT_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 $exePath
              if ($installerPath) {
                & $signtool sign /f $certPath /p $env:SIGNING_CERT_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 $installerPath
              }
              Write-Host "Code signing complete."
            } else {
              Write-Warning "signtool.exe not found on runner."
            }
            Remove-Item -Force $certPath -ErrorAction SilentlyContinue
          } else {
            Write-Host "No Windows signing certificate provided. Continuing with unsigned release build."
          }

      - name: Package Release Assets
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          if ($version.StartsWith("v")) { $version = $version.Substring(1) }
          if ([string]::IsNullOrWhiteSpace($version) -or $version -eq "main") { $version = "2.0.0" }
          
          New-Item -ItemType Directory -Force -Path "dist-release"
          
          # 1. Main Application Executable
          Copy-Item "src-tauri\target\release\keyfx.exe" "dist-release\KeyFX-v$version.exe" -Force
          
          # 2. Windows NSIS Installer
          $installer = Get-ChildItem "src-tauri\target\release\bundle\nsis\*.exe" | Select-Object -First 1
          if ($installer) {
            Copy-Item $installer.FullName "dist-release\KeyFX-Setup-v$version.exe" -Force
          }
          
          # 3. Portable ZIP Distribution
          $tempDir = "$env:RUNNER_TEMP\portable"
          New-Item -ItemType Directory -Force -Path $tempDir
          Copy-Item "src-tauri\target\release\keyfx.exe" "$tempDir\KeyFX.exe" -Force
          @"
===================================================================
 KeyFX v$version - Portable Edition
 Native Windows Mechanical Keyboard Sound Simulator
===================================================================

HOW TO RUN:
1. Double-click 'KeyFX.exe' to launch.
2. No installation required. You can run this from any folder or USB drive.
3. KeyFX runs in the background and appears in your Windows system tray.

SYSTEM REQUIREMENTS:
- Windows 10 (version 1809+) or Windows 11 (64-bit)
- Microsoft Edge WebView2 Runtime (pre-installed on Windows 10/11)

DOCUMENTATION & SOURCE CODE:
https://github.com/Shabazshaik565/keyFX
"@ | Set-Content -Path "$tempDir\README.txt"
          Compress-Archive -Path "$tempDir\*" -DestinationPath "dist-release\KeyFX-Portable-v$version.zip" -Force
          Remove-Item -Recurse -Force $tempDir
          
          # 4. Clean Source Code ZIP
          git archive --format=zip --output="dist-release\KeyFX-Source-v$version.zip" HEAD
          
          Get-ChildItem -Path "dist-release"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: KeyFX ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist-release/KeyFX-Setup-*.exe
            dist-release/KeyFX-v*.exe
            dist-release/KeyFX-Portable-*.zip
            dist-release/KeyFX-Source-*.zip
